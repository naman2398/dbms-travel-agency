{% extends "base.html" %}
{% block title %}Confirm Booking - Travel Agency{% endblock %}
{% block content %}
<section class="card">
  <h2>Passenger details</h2>
  <p class="meta">Enter information for all {{ search.size }} traveler(s).</p>
  <form method="POST">
    {% for i in range(search.size) %}
      <div style="border-top: 1px solid var(--border); padding-top: 1rem; margin-top: 1rem;">
        <strong>Passenger {{ i + 1 }}</strong>
        <div class="grid grid-2">
          <div>
            <label>Full name</label>
            <input type="text" name="passenger_name" required>
          </div>
          <div>
            <label>Email</label>
            <input type="email" name="passenger_email" required>
          </div>
        </div>
        <div class="grid grid-2">
          <div>
            <label>Age</label>
            <input type="number" name="passenger_age" min="0" max="120">
          </div>
          <div>
            <label>Gender</label>
            <select name="passenger_gender">
              <option value="">Prefer not to say</option>
              <option>Male</option>
              <option>Female</option>
              <option>Other</option>
            </select>
          </div>
        </div>
      </div>
    {% endfor %}

    <h2 style="margin-top: 2rem;">Payment</h2>
    <div class="grid grid-2">
      <div>
        <label>Total amount ($)</label>
        <input type="number" step="0.01" name="payment_amount" value="500.00" required>
      </div>
      <div>
        <label>Card last 4 digits</label>
        <input type="text" name="card_last4" pattern="[0-9]{4}" maxlength="4" value="1234" required>
      </div>
    </div>

    <div style="text-align: right; margin-top: 1.6rem;">
      <a href="{{ url_for('plan') }}" class="btn btn-secondary">Back</a>
      <button type="submit">Confirm booking</button>
    </div>
  </form>
</section>
{% endblock %}
